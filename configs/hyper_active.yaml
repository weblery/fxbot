# ═══════════════════════════════════════════════════════════════
#  FOREXBOT Configuration — HYPER ACTIVE (Target: 3+ Trades/Day)
#  Highly relaxed gates designed for maximum trade frequency.
# ═══════════════════════════════════════════════════════════════

account_currency: USD

# Per-symbol settings (High-Frequency Gold/Kiwi Bot)
symbols:
  NZDUSD:
    pip_size: 0.0001
    contract_size: 100000
  XAUUSD:
    pip_size: 0.1
    contract_size: 1

# Risk management
risk:
  per_trade: 0.01                  # Lowered to 1% since frequency is much higher
  max_trades_per_session: 5        # Increased to allow more simultaneous positions
  max_daily_drawdown: 0.06         # 6% daily drawdown kill switch

# Strategy parameters (v3: Volatility Breakout)
strategy:
  trend_method: ema                # Trend filter
  ema_fast: 20                     # Faster trend detection 
  ema_slow: 100                    # Faster trend detection 

  # Volatility squeeze detection (Re-introduced slightly)
  squeeze_atr_fast: 14
  squeeze_atr_slow: 50
  squeeze_ratio: 0.90              # Tighter squeeze restored
  min_squeeze_bars: 2              # Require 2 hours of squeeze

  # ATR settings
  atr_period: 14
  atr_multiplier: 1.5              # Tighter stops 

  # Breakout detection
  breakout_channel: 12             # 12-hour breakouts 
  min_breakout_atr_mult: 0.35      # Strict momentum restored

  # Pullback and Entry
  pullback_ema: 15                 
  min_body_ratio: 0.3              

  # Exits — Fixed RR
  initial_sl_atr: 1.2              # Even tighter stop loss for day trading
  rr_ratio: 1.2                    # Lower RR (1:1.2) to boost win rate

  # Filters
  min_atr_threshold: 0.0004        # Filter out completely dead markets
  min_bars_between_trades: 8       # 8 hour cooldown
  allow_multiple_positions: false  
  trading_sessions:
    - LONDON
    - NEW_YORK

# Timeframe assignment 
timeframes:
  execution: H1                    # entry, breakout, ATR
  trend: H4                        # trend detection

# Backtest settings
backtest:
  spread_pips: 1.5
  slippage_pips: 0.5
  initial_balance: 100
  execution_mode: conservative     
  min_trades: 100                  

# Logging
logging:
  level: INFO
  format: json                     
