<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FOREXBOT | Multi-Bot Control</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #05070a;
            --card-bg: rgba(20, 25, 35, 0.7);
            --accent-primary: #00d2ff;
            --accent-secondary: #3a7bd5;
            --status-green: #00ff9d;
            --status-red: #ff3d71;
            --text-main: #e0e6ed;
            --text-dim: #94a3b8;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }

        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(0, 210, 255, 0.05) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(58, 123, 213, 0.05) 0%, transparent 40%);
            color: var(--text-main);
            min-height: 100vh;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container { width: 100%; max-width: 1200px; }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 3rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 800;
            background: linear-gradient(to right, var(--accent-primary), var(--accent-secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .bot-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 1.5rem;
            padding: 2rem;
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .card:hover { border-color: rgba(0, 210, 255, 0.2); }

        .bot-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .bot-name { font-weight: 800; font-size: 1.25rem; text-transform: uppercase; }

        .status-pill {
            padding: 0.25rem 0.75rem;
            border-radius: 1rem;
            font-size: 0.75rem;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 0.4rem;
            background: rgba(0,0,0,0.3);
        }

        .dot { width: 6px; height: 6px; border-radius: 50%; }
        .dot.online { background: var(--status-green); box-shadow: 0 0 8px var(--status-green); }
        .dot.offline { background: var(--status-red); box-shadow: 0 0 8px var(--status-red); }

        .metric-row { display: flex; justify-content: space-between; margin-bottom: 1rem; }
        .metric-label { color: var(--text-dim); font-size: 0.875rem; }
        .metric-value { font-weight: 600; font-size: 0.875rem; }

        .symbol-list { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-top: 1rem; }
        .symbol-tag { padding: 0.2rem 0.6rem; background: rgba(255,255,255,0.05); border-radius: 0.4rem; font-size: 0.75rem; font-weight: 600; }

        .toggle-btn {
            width: 100%;
            margin-top: 1.5rem;
            padding: 1rem;
            border-radius: 0.75rem;
            border: none;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
        }

        .toggle-btn.active { background: linear-gradient(135deg, #00ff9d, #00d2ff); color: #05070a; }
        .toggle-btn.inactive { background: #252a35; color: var(--text-dim); border: 1px solid rgba(255,255,255,0.1); }

        .log-section { margin-top: 2rem; width: 100%; }
        .log-container {
            background: #0a0c10;
            border-radius: 1rem;
            padding: 1.5rem;
            height: 300px;
            overflow-y: auto;
            font-family: 'Monaco', monospace;
            font-size: 0.8rem;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .log-line { padding: 0.1rem 0; color: var(--text-dim); }
        .log-line.success { color: var(--status-green); }
        .log-line.error { color: var(--status-red); }

        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.1); border-radius: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">FOREXBOT_V3 | COMMAND CENTER</div>
            <div id="global-status" class="status-pill"><div class="dot online"></div>SYSTEM OPERATIONAL</div>
        </header>

        <div id="bot-grid" class="bot-grid">
            <!-- Bot cards will be injected here -->
        </div>

        <div class="log-section">
            <h2 style="font-size: 0.8rem; color: var(--text-dim); margin-bottom: 1rem; text-transform: uppercase;">Central Intelligence Stream</h2>
            <div id="log-viewer" class="log-container">
                <div class="log-line">Connecting to multi-bot telemetry...</div>
            </div>
        </div>
    </div>

    <script>
        const botGrid = document.getElementById('bot-grid');
        const logViewer = document.getElementById('log-viewer');

        async function fetchStatus() {
            try {
                const response = await fetch('/api/status');
                const data = await response.json();
                renderBots(data.bots);
            } catch (err) { console.error(err); }
        }

        function renderBots(bots) {
            botGrid.innerHTML = bots.map(bot => `
                <div class="card">
                    <div class="bot-header">
                        <div class="bot-name">${bot.config}</div>
                        <div class="status-pill">
                            <div class="dot ${bot.mt5_connected ? 'online' : 'offline'}"></div>
                            ${bot.mt5_connected ? 'MT5 LIVE' : 'MT5 DOWN'}
                        </div>
                    </div>
                    
                    <div class="metric-row">
                        <span class="metric-label">Heartbeat</span>
                        <span class="metric-value">${new Date(bot.last_update).toLocaleTimeString()}</span>
                    </div>

                    <div class="symbol-list">
                        ${bot.symbols.map(s => `<div class="symbol-tag">${s}</div>`).join('')}
                    </div>

                    <button 
                        onclick="toggleBot('${bot.config}')" 
                        class="toggle-btn ${bot.is_active ? 'active' : 'inactive'}">
                        ${bot.is_active ? 'BOT ENABLED' : 'BOT PAUSED'}
                    </button>
                </div>
            `).join('');
        }

        async function toggleBot(name) {
            try {
                await fetch('/api/toggle', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ bot_name: name })
                });
                fetchStatus();
            } catch (err) { console.error(err); }
        }

        async function fetchLogs() {
            try {
                const response = await fetch('/api/logs');
                const data = await response.json();
                if (data.logs) {
                    logViewer.innerHTML = data.logs.map(line => {
                        let cls = '';
                        if (line.includes('SIGNAL') || line.includes('SUCCESS')) cls = 'success';
                        if (line.includes('ERROR')) cls = 'error';
                        return `<div class="log-line ${cls}">${line}</div>`;
                    }).join('');
                    logViewer.scrollTop = logViewer.scrollHeight;
                }
            } catch (err) { console.error(err); }
        }

        setInterval(fetchStatus, 3000);
        setInterval(fetchLogs, 5000);
        fetchStatus();
        fetchLogs();
    </script>
</body>
</html>
